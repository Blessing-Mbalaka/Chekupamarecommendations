{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status }} · {{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        .error-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .error-page .panel { max-width: 520px; text-align: center; }
        .error-page__code { font-size: 4.5rem; font-weight: 800; line-height: 1; margin: 0 0 8px; }
    </style>
</head>
<body>
    <main class="error-page">
        <section class="panel">
            <p class="eyebrow">UJ Learning Navigator</p>
            <p class="error-page__code">{{ status }}</p>
            <h2>{{ title }}</h2>
            <p class="muted">{{ message }}</p>
            <div class="button-row" style="justify-content:center">
                <a class="primary-button" href="/">Go home</a>
                <a class="ghost-button" href="javascript:history.back()">Go back</a>
            </div>
        </section>
    </main>
</body>
</html>
